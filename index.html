<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beca Ateliê — Cerâmica Fria & Velas Artesanais</title>
<meta name="description" content="Beca Ateliê — peças de cerâmica fria e velas artesanais feitas à mão com amor. Coleções exclusivas para presentear e decorar.">
<meta name="theme-color" content="#C4784A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────── RESET & TOKENS ─────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:      #F7F2EC;
  --warm-white: #FDFAF6;
  --clay:       #C4784A;
  --clay-light: #D9956A;
  --clay-dark:  #9E5A30;
  --linen:      #E8DDD0;
  --charcoal:   #2C2420;
  --text:       #3D2E26;
  --muted:      #9C8878;
  --border:     #DDD0C4;

  --gap-sm:  16px;
  --gap-md:  32px;
  --gap-lg:  60px;
  --px:      clamp(20px, 5vw, 80px);
  --radius:  2px;
}
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--warm-white);
  color: var(--text);
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; }
a { text-decoration: none; }

/* ─────────────────────────── HAMBURGER MENU ─────────────────────────── */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  z-index: 200;
}
.hamburger span {
  display: block;
  width: 22px; height: 1.5px;
  background: var(--muted);
  transition: transform .3s, opacity .3s;
}
.hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* ─────────────────────────── NAV ─────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px var(--px);
  background: rgba(253,250,246,.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.nav-left, .nav-right {
  display: flex; gap: 32px; align-items: center; list-style: none;
  flex: 1;
}
.nav-right { justify-content: flex-end; gap: 24px; }
.nav-left a, .nav-right a {
  font-size: .72rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--muted); transition: color .2s;
}
.nav-left a:hover, .nav-right a:hover,
.nav-left a.active { color: var(--clay); }
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem; font-weight: 400; letter-spacing: .06em;
  color: var(--charcoal);
  position: absolute; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
}
.nav-logo em { color: var(--clay); font-style: normal; }
.nav-icon {
  width: 17px; height: 17px;
  stroke: var(--muted); fill: none; stroke-width: 1.5;
  transition: stroke .2s; cursor: pointer; flex-shrink: 0;
}
.nav-icon:hover { stroke: var(--clay); }

/* Mobile drawer */
.mobile-drawer {
  display: none;
  position: fixed; inset: 0; z-index: 90;
  background: var(--warm-white);
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 36px;
  padding: 80px 40px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.mobile-drawer.open {
  display: flex; opacity: 1; pointer-events: auto;
}
.mobile-drawer a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem; color: var(--charcoal); letter-spacing: .04em;
  transition: color .2s;
}
.mobile-drawer a:hover { color: var(--clay); }

/* ─────────────────────────── HERO ─────────────────────────── */
.hero {
  min-height: 100svh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: clamp(90px,12vh,130px) var(--px) 60px;
  gap: clamp(32px, 5vw, 72px);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 55% 90% at 80% 50%, #EDE0D0 0%, transparent 65%);
  pointer-events: none;
}
.hero-text { position: relative; z-index: 1; }
.hero-eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: clamp(.95rem,1.5vw,1.1rem);
  color: var(--clay); letter-spacing: .04em;
  display: block; margin-bottom: 18px;
  opacity: 0; animation: fadeUp .7s .15s forwards;
}
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 5vw, 4rem);
  font-weight: 300; line-height: 1.18;
  color: var(--charcoal); margin-bottom: 24px;
  opacity: 0; animation: fadeUp .7s .3s forwards;
}
.hero-sub {
  font-size: clamp(.82rem, 1.2vw, .9rem);
  line-height: 1.85; color: var(--muted);
  max-width: 400px; margin-bottom: 44px;
  opacity: 0; animation: fadeUp .7s .45s forwards;
}
.hero-actions {
  display: flex; gap: 14px; flex-wrap: wrap;
  opacity: 0; animation: fadeUp .7s .6s forwards;
}
.hero-image-col {
  position: relative; z-index: 1;
  opacity: 0; animation: fadeIn .9s .4s forwards;
}
.hero-frame {
  width: 100%;
  aspect-ratio: 3/4;
  max-height: 540px;
  background: var(--linen);
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.hero-frame::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(196,120,74,.07) 0%, transparent 55%);
  pointer-events: none;
}
.hero-frame img { position: absolute; inset: 0; z-index: 1; }
.placeholder-inner {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  opacity: .5;
}
.placeholder-inner svg { width: 56px; height: 56px; stroke: var(--clay); fill: none; stroke-width: .9; }
.placeholder-inner span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 1rem; color: var(--muted);
}

/* ─────────────────────────── BUTTONS ─────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 28px;
  font-family: 'Jost', sans-serif;
  font-size: .72rem; font-weight: 400;
  letter-spacing: .13em; text-transform: uppercase;
  transition: background .25s, color .25s, transform .2s, border-color .25s;
  cursor: pointer; border: 1px solid transparent;
}
.btn-fill { background: var(--clay); color: #fff; }
.btn-fill:hover { background: var(--clay-dark); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--clay); border-color: var(--clay); }
.btn-ghost:hover { background: var(--clay); color: #fff; }

/* ─────────────────────────── TICKER ─────────────────────────── */
.ticker { background: var(--clay); padding: 13px 0; overflow: hidden; white-space: nowrap; }
.ticker-track { display: inline-flex; animation: ticker 28s linear infinite; }
.ticker-track span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: .95rem;
  color: rgba(255,255,255,.88); letter-spacing: .1em;
  padding: 0 36px;
}
.ticker-track span::before { content: '\2726'; margin-right: 36px; opacity: .45; }

/* ─────────────────────────── FEATURES ─────────────────────────── */
.features {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  border-bottom: 1px solid var(--border);
}
.feat {
  padding: clamp(32px,5vw,56px) clamp(20px,3vw,40px);
  border-right: 1px solid var(--border);
  text-align: center;
  transition: background .3s;
}
.feat:last-child { border-right: none; }
.feat:hover { background: var(--cream); }
.feat-icon { margin-bottom: 14px; }
.feat-icon svg { width: 28px; height: 28px; stroke: var(--clay); fill: none; stroke-width: 1.2; }
.feat-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1rem,1.4vw,1.15rem); font-weight: 500;
  color: var(--charcoal); margin-bottom: 8px;
}
.feat-text { font-size: .78rem; line-height: 1.75; color: var(--muted); }

/* ─────────────────────────── SECTION HEAD ─────────────────────────── */
.sec-head { text-align: center; margin-bottom: clamp(40px,6vw,64px); }
.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 1rem;
  color: var(--clay); letter-spacing: .06em;
  display: block; margin-bottom: 10px;
}
.sec-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.9rem, 4vw, 3rem);
  font-weight: 300; line-height: 1.2;
  color: var(--charcoal); margin-bottom: 14px;
}
.sec-sub {
  font-size: .85rem; color: var(--muted);
  line-height: 1.8; max-width: 480px; margin: 0 auto;
}

/* ─────────────────────────── COLLECTIONS ─────────────────────────── */
.collections { padding: clamp(60px,10vw,100px) var(--px); }
.collections-grid {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: clamp(16px,2vw,24px);
}
.col-card { cursor: pointer; }
.col-img {
  aspect-ratio: 3/4;
  background: var(--linen);
  overflow: hidden; position: relative; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: transform .4s ease;
}
.col-card:hover .col-img { transform: scale(1.01); }
.col-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(44,36,32,.3) 0%, transparent 55%);
  opacity: 0; transition: opacity .35s;
}
.col-card:hover .col-img::after { opacity: 1; }
.col-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  opacity: .35;
}
.col-placeholder svg { width: 32px; height: 32px; stroke: var(--muted); fill: none; stroke-width: 1; }
.col-placeholder span { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.col-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1rem,1.4vw,1.2rem);
  color: var(--charcoal); margin-bottom: 6px;
}
.col-desc { font-size: .76rem; color: var(--muted); line-height: 1.65; margin-bottom: 12px; }
.col-link {
  font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--clay); display: inline-flex; align-items: center; gap: 5px;
  transition: gap .2s;
}
.col-link:hover { gap: 9px; }

/* ─────────────────────────── ABOUT ─────────────────────────── */
.about { display: grid; grid-template-columns: 1fr 1fr; min-height: 560px; }
.about-img {
  background: var(--linen);
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  min-height: 380px;
}
.about-img-placeholder { opacity: .3; }
.about-img-placeholder svg { width: 72px; height: 72px; stroke: var(--muted); fill: none; stroke-width: .8; }
.about-body {
  background: var(--cream);
  padding: clamp(48px,7vw,88px) clamp(32px,5vw,80px);
  display: flex; flex-direction: column; justify-content: center;
}
.about-body .eyebrow, .about-body .sec-title { text-align: left; }
.about-body .sec-title { margin-bottom: 20px; }
.about-p { font-size: .88rem; line-height: 1.95; color: var(--muted); margin-bottom: 36px; }

/* ─────────────────────────── CANDLES ─────────────────────────── */
.candles {
  padding: clamp(60px,10vw,100px) var(--px);
  background: var(--charcoal);
}
.candles .sec-title { color: var(--cream); }
.candles .sec-sub { color: rgba(255,255,255,.38); }
.candles .eyebrow { color: var(--clay-light); }
.candles-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: clamp(16px,2vw,28px);
  margin-top: clamp(40px,6vw,60px);
}
.candle-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  transition: background .3s, transform .3s;
  cursor: pointer;
}
.candle-card:hover { background: rgba(255,255,255,.08); transform: translateY(-4px); }
.candle-img {
  aspect-ratio: 1;
  background: rgba(255,255,255,.03);
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.candle-img img { position: absolute; inset: 0; z-index: 1; }
.candle-ph {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  opacity: .18;
}
.candle-ph svg { width: 40px; height: 40px; stroke: var(--cream); fill: none; stroke-width: 1; }
.candle-ph span { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--cream); }
.candle-info { padding: 22px 26px 28px; }
.candle-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.1rem,1.6vw,1.35rem);
  color: var(--cream); margin-bottom: 8px;
}
.candle-desc { font-size: .78rem; color: rgba(255,255,255,.38); line-height: 1.75; }
.candle-tag {
  display: inline-block; margin-top: 14px;
  padding: 5px 14px;
  border: 1px solid rgba(196,120,74,.35);
  font-size: .67rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--clay-light);
}

/* ─────────────────────────── INSTAGRAM ─────────────────────────── */
.instagram { padding: clamp(60px,8vw,88px) var(--px); text-align: center; }
.instagram .sec-title { font-size: clamp(1.4rem,2.5vw,1.8rem); margin-bottom: 0; }
.ig-grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: clamp(6px,1vw,10px);
  margin: clamp(32px,5vw,48px) 0;
}
.ig-item {
  aspect-ratio: 1;
  background: var(--linen);
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.ig-item img { position: absolute; inset: 0; z-index: 1; }
.ig-item::after {
  content: '';
  position: absolute; inset: 0; z-index: 2;
  background: rgba(196,120,74,.45);
  opacity: 0; transition: opacity .3s;
}
.ig-item:hover::after { opacity: 1; }
.ig-ph {
  font-size: .55rem; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); opacity: .4;
}

/* ─────────────────────────── CUSTOM SECTIONS ─────────────────────────── */
.custom-section { padding: clamp(60px,10vw,100px) var(--px); }
.custom-section.dark-bg { background: var(--charcoal); }
.custom-section.dark-bg .sec-title { color: var(--cream); }
.custom-section.dark-bg .sec-sub { color: rgba(255,255,255,.38); }
.custom-section.dark-bg .eyebrow { color: var(--clay-light); }
.custom-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: clamp(8px,1.5vw,16px);
}
.custom-gallery-item {
  aspect-ratio: 1; background: var(--linen);
  overflow: hidden; position: relative;
}
.custom-gallery-item img { position: absolute; inset: 0; }
.custom-products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: clamp(16px,2vw,24px);
}
.custom-product-card { cursor: pointer; }
.custom-product-img {
  aspect-ratio: 3/4; background: var(--linen);
  overflow: hidden; position: relative; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: center;
}
.custom-product-img img { position: absolute; inset: 0; }
.custom-textimage { display: grid; grid-template-columns: 1fr 1fr; min-height: 400px; }
.custom-textimage-img {
  background: var(--linen); position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; min-height: 300px;
}
.custom-textimage-img img { position: absolute; inset: 0; }
.custom-textimage-body {
  background: var(--cream);
  padding: clamp(48px,7vw,88px) clamp(32px,5vw,80px);
  display: flex; flex-direction: column; justify-content: center;
}
.custom-textimage-body .sec-title { text-align: left; margin-bottom: 20px; }
.custom-textimage-body .eyebrow { text-align: left; }
.custom-textimage-text { font-size: .88rem; line-height: 1.95; color: var(--muted); }
.custom-banner {
  min-height: 420px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; position: relative;
  background-size: cover; background-position: center;
  padding: 60px var(--px);
}
.custom-banner-overlay {
  position: absolute; inset: 0;
  background: rgba(44,36,32,.55);
}
.custom-banner-content { position: relative; z-index: 1; max-width: 600px; }
.custom-banner-content .sec-title { color: #fff; }
.custom-banner-content .sec-sub { color: rgba(255,255,255,.75); }
.custom-banner-content .eyebrow { color: var(--clay-light); }

/* ─────────────────────────── WHATSAPP FLOAT ─────────────────────────── */
.wa-float {
  position: fixed; bottom: 24px; right: 24px; z-index: 90;
  width: 56px; height: 56px;
  background: #25D366; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,211,102,.35);
  transition: transform .25s, box-shadow .25s;
  cursor: pointer;
}
.wa-float:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(37,211,102,.45); }
.wa-float svg { width: 28px; height: 28px; fill: #fff; }
.wa-float.hidden { display: none; }

/* ─────────────────────────── FOOTER ─────────────────────────── */
footer {
  background: var(--cream);
  padding: clamp(52px,8vw,80px) var(--px) 36px;
  border-top: 1px solid var(--border);
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: clamp(32px,4vw,60px);
  margin-bottom: clamp(40px,6vw,60px);
}
.footer-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; color: var(--charcoal); letter-spacing: .06em;
  display: block; margin-bottom: 14px;
}
.footer-logo em { color: var(--clay); font-style: normal; }
.footer-tagline { font-size: .8rem; color: var(--muted); line-height: 1.75; max-width: 230px; }
.footer-col h4 {
  font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--charcoal); margin-bottom: 18px; font-weight: 500;
}
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 10px; }
.footer-col ul li a { font-size: .8rem; color: var(--muted); transition: color .2s; }
.footer-col ul li a:hover { color: var(--clay); }
.contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.contact-row svg { width: 15px; height: 15px; stroke: var(--clay); fill: none; stroke-width: 1.5; flex-shrink: 0; }
.contact-row a, .contact-row span { font-size: .8rem; color: var(--muted); }
.contact-row a:hover { color: var(--clay); }
.footer-bottom {
  border-top: 1px solid var(--border); padding-top: 24px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}
.footer-copy { font-size: .72rem; color: var(--muted); letter-spacing: .05em; }

/* ─────────────────────────── ANIMATIONS ─────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.reveal {
  opacity: 0; transform: translateY(18px);
  transition: opacity .65s ease, transform .65s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ─────────────────────────── SCROLL HINT ─────────────────────────── */
.scroll-hint {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: .35;
}
.scroll-hint span { font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.scroll-line { width: 1px; height: 44px; background: var(--clay); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { opacity: .3; transform: scaleY(1); }
  50%      { opacity: 1; transform: scaleY(.5); transform-origin: top; }
}

/* ═══════════════════════════════════════════════
   RESPONSIVE — Tablet (≤ 900px)
   ═══════════════════════════════════════════════ */
@media (max-width: 900px) {
  .nav-left { display: none; }
  .nav-right { display: none; }
  .hamburger { display: flex; }
  .hero {
    grid-template-columns: 1fr;
    padding-top: clamp(90px,14vh,120px);
    text-align: center;
  }
  .hero::before {
    background: radial-gradient(ellipse 80% 50% at 50% 100%, #EDE0D0 0%, transparent 70%);
  }
  .hero-sub { margin-left: auto; margin-right: auto; }
  .hero-actions { justify-content: center; }
  .hero-image-col { order: -1; }
  .hero-frame { max-height: 340px; aspect-ratio: 4/3; }

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function waLink(number, msg) {
  if (!number) return '#contato';
  const clean = number.replace(/\D/g, '');
  return 'https://wa.me/' + clean + '?text=' + encodeURIComponent(msg || '');
}

function imgOrPlaceholder(url, alt, phSvg, phText) {
  if (url) return '<img src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy">';
  if (phSvg) return '<div class="col-placeholder">' + phSvg + '<span>' + esc(phText || 'foto') + '</span></div>';
  return '';
}

function deepMerge(defaults, override) {
  const result = {};
  for (const key of Object.keys(defaults)) {
    if (override && key in override) {
      if (Array.isArray(defaults[key])) {
        result[key] = override[key];
      } else if (typeof defaults[key] === 'object' && defaults[key] !== null && !Array.isArray(defaults[key])) {
        result[key] = deepMerge(defaults[key], override[key]);
      } else {
        result[key] = override[key];
      }
    } else {
      result[key] = defaults[key];
    }
  }
  if (override) {
    for (const key of Object.keys(override)) {
      if (!(key in defaults)) result[key] = override[key];
    }
  }
  return result;
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTIONS
   ═══════════════════════════════════════════════════════════════ */
function initInteractions() {
  const ham = document.getElementById('ham');
  const drawer = document.getElementById('drawer');
  if (!ham || !drawer) return;

  ham.addEventListener('click', () => {
    ham.classList.toggle('open');
    drawer.classList.toggle('open');
    document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : '';
  });

  drawer.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      ham.classList.remove('open');
      drawer.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  const sections = document.querySelectorAll('section[id]');
  const navLinks = document.querySelectorAll('.nav-left a');
  window.addEventListener('scroll', () => {
    let cur = '';
    sections.forEach(s => { if (window.scrollY >= s.offsetTop - 130) cur = s.id; });
    navLinks.forEach(a => {
      a.classList.remove('active');
      if (a.getAttribute('href') === '#' + cur) a.classList.add('active');
    });
  }, { passive: true });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = (i % 4) * 80 + 'ms';
    observer.observe(el);
  });
}

/* ═══════════════════════════════════════════════════════════════
   LOAD FROM FIREBASE & INIT
   ═══════════════════════════════════════════════════════════════ */
async function loadFromFirebase() {
  if (!db) return null;
  try {
    const doc = await db.collection('site').doc('content').get();
    if (doc.exists) return doc.data();
  } catch (e) { /* silent fail */ }
  return null;
}

async function init() {
  renderApp(DEFAULTS);
  initInteractions();

  const fbData = await loadFromFirebase();
  if (fbData) {
    const merged = deepMerge(DEFAULTS, fbData);
    renderApp(merged);
    initInteractions();
  }
}

init();
</script>
